name: Deploy to Railway

# Every push to main runs the checks, then deploys with the RAILWAY_TOKEN repo secret
# (Railway project token). No Railway account needed for whoever merges.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Checks
        run: |
          npm run check
          npm test
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set, so nothing was deployed."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          npx -y @railway/cli up --service pine --ci
